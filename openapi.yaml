openapi: 3.1.0
info:
  title: Тут и там
  version: 1.0.0
  description: 'Собственный API продукта «Тут и там»: каталог досуга рядом, личные мероприятия, чат MAX,
    карта, отзывы и ассистент. Авторизация мини-приложения — заголовок Authorization: tma <initData>.
    Для локальной проверки жюри при LOCAL_DEV_AUTH_ENABLED=true и запросе на localhost подходит Authorization:
    tma local-development:<max_user_id>:<имя>:<локаль>.'
  contact:
    name: Тут и там
servers:
- url: https://tut-i-tam.goliluha.ru
  description: Стенд проверки
- url: http://localhost:8081
  description: Локальный стенд через nginx мини-приложения
