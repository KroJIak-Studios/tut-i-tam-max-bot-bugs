services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  db-init:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ACCESS_CODE_ENABLED: ${ACCESS_CODE_ENABLED:-false}
      ACCESS_CODE: ${ACCESS_CODE}
      FALLBACK_LOCALE: ${FALLBACK_LOCALE:-ru-ru}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ACCESS_CODE_ENABLED: ${ACCESS_CODE_ENABLED:-false}
      ACCESS_CODE: ${ACCESS_CODE}
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FALLBACK_LOCALE: ${FALLBACK_LOCALE:-ru-ru}
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-false}
    expose:
      - "8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  bot:
    build:
      context: ./bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_URL: http://api:8000
      FALLBACK_LOCALE: ${FALLBACK_LOCALE:-ru-ru}
      BOT_UPDATE_TRANSPORT: ${BOT_UPDATE_TRANSPORT:-long-polling}
      BOT_WEBHOOK_DOMAIN: ${BOT_WEBHOOK_DOMAIN:-}
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:-}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  admin-panel:
    build:
      context: ./frontend/admin-panel
      args:
        VITE_FALLBACK_LOCALE: ${FALLBACK_LOCALE:-ru-ru}
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://api:8000}
      NGINX_ENVSUBST_FILTER: BACKEND_URL
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

  mini-app:
    build:
      context: ./frontend/mini-app
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://api:8000}
      NGINX_ENVSUBST_FILTER: BACKEND_URL
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
