# DATA-API 1.0 — обязательные проверки API «Тут и там».
#
# Секретов здесь нет. Роль user — тестовый пользователь мини-приложения.
# Заголовок передаётся отдельно и подставляется проверяющим:
#   Authorization: tma local-development:910001:Jury:ru-ru
# Локальный стенд принимает его, когда LOCAL_DEV_AUTH_ENABLED=true и запрос идёт на localhost.
# Повторный прогон создаёт новое мероприятие и удаляет его в cleanup.

schemaVersion: "1.0"

solution:
  name: "Тут и там"
  teamId: "94"

api:
  baseUrl: "https://tut-i-tam.goliluha.ru"
  openapi: "./openapi.yaml"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health"
    name: "Сервис отвечает"
    description: "API и база доступны"
    method: "GET"
    path: "/api/health"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "status"
      bodySchema:
        type: "object"
        required: ["status"]
        properties:
          status:
            const: "ok"
    timeoutMs: 5000
    repeatable: true

  - id: "local-dev-auth"
    name: "Локальный вход разрешён на этом стенде"
    description: "Проверяющий видит, что тестовый заголовок tma принимается"
    method: "GET"
    path: "/api/v1/local-dev-auth"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "enabled"
      bodySchema:
        type: "object"
        properties:
          enabled:
            const: true
    timeoutMs: 5000
    repeatable: true

  - id: "cities"
    name: "Справочник городов"
    description: "В демо-данных есть Казань"
    method: "GET"
    path: "/api/v1/cities"
    role: "user"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        minItems: 1
    timeoutMs: 5000
    repeatable: true
    extract:
      cityId: "$[0].id"

  - id: "categories"
    name: "Категории досуга"
    method: "GET"
    path: "/api/v1/event-categories"
    role: "user"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        minItems: 1
    timeoutMs: 5000
    repeatable: true

  - id: "nearby"
    name: "Рядом с Кремлём находится мероприятие"
    description: "Точка в центре Казани возвращает ближайшее видимое событие"
    method: "POST"
    path: "/api/recommendations/app/nearby"
    role: "user"
    request:
      headers:
        Content-Type: "application/json"
      body:
        latitude: 55.796
        longitude: 49.106
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "title"
        - "address"
        - "starts_at"
    timeoutMs: 5000
    repeatable: true

  - id: "create-event"
    name: "Пользователь создаёт своё мероприятие"
    description: "Событие сохраняется и сразу принадлежит автору"
    method: "POST"
    path: "/api/v1/events"
    role: "user"
    dependsOn:
      - "cities"
    request:
      headers:
        Content-Type: "application/json"
      body:
        title: "Прогулка для технической проверки"
        description: "Событие создано автоматической проверкой и будет удалено."
        city_id: "${cityId}"
        address: "Казанский Кремль"
        latitude: 55.798
        longitude: 49.105
        starts_at: "2026-10-20T12:00:00+03:00"
        ends_at: "2026-10-20T14:00:00+03:00"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "title"
        - "owned"
        - "visible"
      bodySchema:
        type: "object"
        properties:
          title:
            const: "Прогулка для технической проверки"
          owned:
            const: true
    timeoutMs: 5000
    repeatable: false
    extract:
      eventId: "$.id"

  - id: "read-event"
    name: "Автор читает карточку своего мероприятия"
    method: "GET"
    path: "/api/v1/events/{eventId}"
    role: "user"
    dependsOn:
      - "create-event"
    request:
      path:
        eventId: "${eventId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "title"
        - "owned"
        - "address"
    timeoutMs: 5000
    repeatable: true

  - id: "link-chat"
    name: "К мероприятию привязывается ссылка-приглашение MAX"
    description: "Принимается только ссылка вида max.ru/join/. Присутствие бота в чате не проверяется"
    method: "POST"
    path: "/api/v1/events/{eventId}/chat"
    role: "user"
    dependsOn:
      - "create-event"
    request:
      path:
        eventId: "${eventId}"
      headers:
        Content-Type: "application/json"
      body:
        chat_invite_url: "https://max.ru/join/jury-check-tut-i-tam"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "connected"
        - "missing"
      bodySchema:
        type: "object"
        properties:
          connected:
            const: true
          missing:
            const: []
    timeoutMs: 5000
    repeatable: true

  - id: "reject-foreign-link"
    name: "Обычная ссылка не привязывается"
    method: "POST"
    path: "/api/v1/events/{eventId}/chat"
    role: "user"
    dependsOn:
      - "link-chat"
    request:
      path:
        eventId: "${eventId}"
      headers:
        Content-Type: "application/json"
      body:
        chat_invite_url: "https://example.com/not-an-invite"
    expected:
      statusCodes: [422]
      contentType: "application/json"
      requiredFields:
        - "detail"
      bodySchema:
        type: "object"
        properties:
          detail:
            const: "invalid_chat_link"
    timeoutMs: 5000
    repeatable: true

  - id: "unauthorized"
    name: "Неверная подпись мини-приложения закрывает каталог"
    method: "GET"
    path: "/api/v1/cities"
    role: "public"
    request:
      headers:
        Authorization: "tma nope"
    expected:
      statusCodes: [401]
      contentType: "application/json"
      requiredFields:
        - "detail"
      bodySchema:
        type: "object"
        properties:
          detail:
            const: "init_data_invalid"
    timeoutMs: 5000
    repeatable: true

cleanup:
  - id: "delete-event"
    method: "DELETE"
    path: "/api/v1/events/{eventId}"
    role: "user"
    request:
      path:
        eventId: "${eventId}"
    expected:
      statusCodes: [204, 404]
    timeoutMs: 5000
