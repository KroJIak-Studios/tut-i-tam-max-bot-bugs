name: tut-i-tam

services:
  mini-app:
    build:
      context: ./frontend/mini-app
      dockerfile: Dockerfile
    container_name: tut_i_tam_mini_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINI_APP_PORT:-8085}:80"
    environment:
      USE_MOCKS: ${MINIAPP_USE_MOCKS:-true}
      BACKEND_URL: ${BACKEND_URL:-http://127.0.0.1:8000}
      NGINX_ENVSUBST_FILTER: BACKEND_URL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
